name: Auto Scrape SH Notices

on:
  schedule:
    - cron: '0 0 * * *' # 매일 한국시간 오전 9시 자동 실행
  workflow_dispatch: # 버튼 눌러서 즉시 실행 기능

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install axios cheerio

      - name: Run SH Scraper
        run: node scrape-sh.js

      - name: Commit & Push updated notices.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/notices.json
          git commit -m "auto: SH 모집공고 자동 업데이트" || exit 0
          git push
