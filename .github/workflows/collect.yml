name: 청약 데이터 자동 수집

on:
  schedule:
    # 💡 UTC 기준 2시간마다 실행 ('0 */2 * * *' = 한국시간 기준 매 짝수 시 정각)
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: 의존성 설치
        run: |
          npm install
          pip install requests pdfplumber olefile google-genai

      - name: 데이터 전체 수집 (LH, GH, 청약홈, SH)
        env:
          LH_SERVICE_KEY: ${{ secrets.LH_SERVICE_KEY }}
          GH_SERVICE_KEY: ${{ secrets.GH_SERVICE_KEY }}
          REB_SERVICE_KEY: ${{ secrets.REB_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm run collect
          python main.py

      - name: 신규 공고 이메일 알림 발송
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: npm run notify

      - name: 변경사항 저장소에 반영
        run: |
          git config user.name "cheongyaknara-bot"
          git config user.email "bot@example.com"
          git add data/notices.json data/notices.prev.json
          git commit -m "chore: 청약 공고 자동 업데이트" || echo "No changes to commit"
          git fetch origin main
          git push origin HEAD:main --force
