name: 청약 데이터 자동 수집

on:
  schedule:
    # UTC 기준 2시간마다 실행 ('0 */2 * * *')
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: |
          npm install
          pip install requests pdfplumber olefile google-genai

      - name: 데이터 전체 수집 (LH, GH, 청약홈, SH)
        env:
          LH_SERVICE_KEY: ${{ secrets.LH_SERVICE_KEY }}
          GH_SERVICE_KEY: ${{ secrets.GH_SERVICE_KEY }}
          REB_SERVICE_KEY: ${{ secrets.REB_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm run collect
          python main.py

      - name: LH 이미지 다운로드 테스트
        continue-on-error: true
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node <<'EOF'
          const { chromium } = require("playwright");
          const fs = require("fs");
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36";

          (async () => {
            try {
              const ip = await (await fetch("https://ipinfo.io/json")).json();
              console.log(`[러너 위치] ${ip.ip} / ${ip.country} / ${ip.city}`);
            } catch (e) {
              console.log("[러너 위치] 확인 실패:", e.message);
            }

            const data = JSON.parse(fs.readFileSync("data/notices.json", "utf-8"));
            const seen = new Set();
            const urls = [];
            for (const n of data.notices || []) {
              if (n.source_agency !== "LH") continue;
              for (const img of n.image_urls || []) {
                if (img.url && !seen.has(img.url) && urls.length < 3) {
                  seen.add(img.url);
                  urls.push(img.url);
                }
              }
            }
            if (urls.length === 0) {
              console.log("[테스트] LH 이미지 URL을 못 찾음 (스킵)");
              return;
            }

            const browser = await chromium.launch();
            for (const url of urls) {
              console.log(`\n[테스트 URL] ${url}`);
              try {
                const res = await fetch(url, { headers: { "User-Agent": UA } });
                const buf = Buffer.from(await res.arrayBuffer());
                console.log(`  [1. 단순 fetch] status=${res.status} type=${res.headers.get("content-type")} size=${buf.length}`);
              } catch (e) {
                console.log("  [1. 단순 fetch] 실패:", e.message);
              }
              try {
                const page = await browser.newPage();
                const res = await page.goto(url, { timeout: 30000 });
                const buf = await res.body();
                console.log(`  [2. Playwright] status=${res.status()} type=${res.headers()["content-type"]} size=${buf.length}`);
                await page.close();
              } catch (e) {
                console.log("  [2. Playwright] 실패:", e.message);
              }
            }
            await browser.close();
          })().catch((e) => console.log("[테스트 오류]", e.message));
          EOF

      - name: 신규 공고 이메일 알림 발송
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: npm run notify

      - name: 변경사항 저장소에 반영
        run: |
          git config user.name "cheongyaknara-bot"
          git config user.email "bot@example.com"
          git add data/notices.json data/notices.prev.json
          git commit -m "chore: 청약 공고 자동 업데이트" || echo "No changes to commit"
          git fetch origin main
          git push origin HEAD:main --force
