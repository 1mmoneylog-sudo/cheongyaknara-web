name: 청약 데이터 자동 수집

on:
  schedule:
    # 💡 UTC 기준 2시간마다 실행 ('0 */2 * * *' = 한국시간 기준 매 짝수 시 정각)
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 의존성 설치
        run: npm install

      - name: 데이터 전체 수집 (LH, GH, 청약홈, SH)
        env:
          LH_SERVICE_KEY: ${{ secrets.LH_SERVICE_KEY }}
          GH_SERVICE_KEY: ${{ secrets.GH_SERVICE_KEY }}
          REB_SERVICE_KEY: ${{ secrets.REB_SERVICE_KEY }}
        run: npm run collect

      - name: 변경사항 저장소에 반영
        run: |
          git config user.name "cheongyaknara-bot"
          git config user.email "bot@example.com"
          git add data/notices.json
          git commit -m "chore: 청약 공고 자동 업데이트" || echo "No changes to commit"
          git fetch origin main
          git push origin HEAD:main --force
