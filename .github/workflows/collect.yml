name: 청약 데이터 자동 수집

on:
  schedule:
    # UTC 기준 2시간마다 실행 ('0 */2 * * *')
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: |
          npm install
          pip install requests pdfplumber olefile google-genai

      - name: 데이터 전체 수집 (LH, GH, 청약홈, SH)
        env:
          LH_SERVICE_KEY: ${{ secrets.LH_SERVICE_KEY }}
          GH_SERVICE_KEY: ${{ secrets.GH_SERVICE_KEY }}
          REB_SERVICE_KEY: ${{ secrets.REB_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm run collect
          python main.py

      - name: LH 이미지 다운로드 테스트
        continue-on-error: true
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node <<'EOF'
          const { chromium } = require("playwright");
          const fs = require("fs");
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36";
          const show = (type, buf) =>
            String(type || "").includes("text")
              ? buf.toString("utf8").replace(/\s+/g, " ").slice(0, 700)
              : "(이미지/바이너리)";

          (async () => {
            const data = JSON.parse(fs.readFileSync("data/notices.json", "utf-8"));
            const n = (data.notices || []).find(
              (x) => x.source_agency === "LH" && (x.image_urls || []).length > 0 && x.detail_url
            );
            if (!n) {
              console.log("[테스트] 대상 공고 없음");
              return;
            }
            const imgUrl = n.image_urls[0].url;
            const detailUrl = n.detail_url;
            console.log("[상세페이지]", detailUrl);
